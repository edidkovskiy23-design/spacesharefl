<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpaceShareFL</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:Arial,sans-serif}
.site{position:relative;width:100%;max-width:1320px;margin:0 auto}
.site img{width:100%;display:block}
.hot{position:absolute;z-index:50;cursor:pointer;background:transparent;border:0}

/* кнопки на картинке */
.findNav{left:33%;top:2.7%;width:10%;height:2.5%}
.listNav{left:44%;top:2.7%;width:12%;height:2.5%}
.howNav{left:58%;top:2.7%;width:10%;height:2.5%}
.aboutNav{left:70%;top:2.7%;width:9%;height:2.5%}
.contactNav{left:80%;top:2.7%;width:8%;height:2.5%}
.listTop{left:84%;top:1.7%;width:13%;height:4%}

.findHero{left:3%;top:24.5%;width:20%;height:4%}
.listHero{left:24%;top:24.5%;width:17%;height:4%}
.explore{left:6%;top:63.5%;width:13%;height:4%}
.ownerBtn{left:44%;top:78%;width:17%;height:4%}
.findBottom{left:73%;top:89%;width:21%;height:4%}

/* формы */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:999;align-items:center;justify-content:center;padding:20px}
.modal.active{display:flex}
.box{background:#fff;width:100%;max-width:520px;border-radius:24px;padding:26px;box-shadow:0 20px 60px #0008}
.box h2{margin:0 0 12px;color:#061b36}
input,select,textarea{width:100%;padding:14px;margin:7px 0;border:1px solid #dcebe3;border-radius:12px;font-size:16px}
textarea{min-height:90px}
.btn{width:100%;border:0;background:#18b957;color:#fff;border-radius:14px;padding:15px;font-weight:800;font-size:16px;margin-top:8px}
.close{background:#eee;color:#111}
</style>
</head>
<body>

<div class="site">
  <img src="IMG_8297.png">

  <button class="hot findNav" onclick="openForm('find')"></button>
  <button class="hot listNav" onclick="openForm('owner')"></button>
  <button class="hot howNav" onclick="scrollToForms()"></button>
  <button class="hot aboutNav" onclick="alert('SpaceShareFL helps people in South Florida find secure storage for boats, jet skis, trailers and RVs.')"></button>
  <button class="hot contactNav" onclick="openForm('contact')"></button>
  <button class="hot listTop" onclick="openForm('owner')"></button>

  <button class="hot findHero" onclick="openForm('find')"></button>
  <button class="hot listHero" onclick="openForm('owner')"></button>
  <button class="hot explore" onclick="openForm('find')"></button>
  <button class="hot ownerBtn" onclick="openForm('owner')"></button>
  <button class="hot findBottom" onclick="openForm('find')"></button>
</div>

<div class="modal" id="findModal">
  <div class="box">
    <h2>Find Storage Near Me</h2>
    <form action="https://formspree.io/f/xdavwkjp" method="POST">
      <input type="hidden" name="form_type" value="Renter request">
      <input name="name" placeholder="Your name" required>
      <input name="phone" placeholder="Phone number" required>
      <input name="email" type="email" placeholder="Email" required>
      <select name="storage_type" required>
        <option value="">What do you need to store?</option>
        <option>Boat</option><option>Jet Ski</option><option>Trailer</option><option>RV</option><option>Extra Space</option>
      </select>
      <input name="city" placeholder="City / area" required>
      <textarea name="details" placeholder="Size, date, notes"></textarea>
      <button class="btn" type="submit">Send Request</button>
    </form>
    <button class="btn close" onclick="closeForms()">Close</button>
  </div>
</div>

<div class="modal" id="ownerModal">
  <div class="box">
    <h2>List Your Space</h2>
    <form action="https://formspree.io/f/xdavwkjp" method="POST">
      <input type="hidden" name="form_type" value="Owner listing">
      <input name="owner_name" placeholder="Your name" required>
      <input name="owner_phone" placeholder="Phone number" required>
      <input name="owner_email" type="email" placeholder="Email" required>
      <input name="city" placeholder="City / area" required>
      <textarea name="details" placeholder="Describe your space, size, price, access"></textarea>
      <button class="btn" type="submit">Submit Space</button>
    </form>
    <button class="btn close" onclick="closeForms()">Close</button>
  </div>
</div>

<div class="modal" id="contactModal">
  <div class="box">
    <h2>Contact SpaceShareFL</h2>
    <form action="https://formspree.io/f/xdavwkjp" method="POST">
      <input type="hidden" name="form_type" value="Support request">
      <input name="name" placeholder="Your name" required>
      <input name="email" type="email" placeholder="Email" required>
      <textarea name="message" placeholder="Message" required></textarea>
      <button class="btn" type="submit">Send Message</button>
    </form>
    <button class="btn close" onclick="closeForms()">Close</button>
  </div>
</div>

<script>
function openForm(type){
  closeForms();
  document.getElementById(type + "Modal").classList.add("active");
}
function closeForms(){
  document.querySelectorAll(".modal").forEach(m=>m.classList.remove("active"));
}
function scrollToForms(){
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}
</script>

</body>
</html>
