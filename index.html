<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpaceShareFL</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f6fbf8;color:#061b36}
.hero img{width:100%;display:block}
.ctaBar{position:sticky;bottom:0;background:#fff;padding:14px;display:flex;gap:12px;justify-content:center;box-shadow:0 -8px 30px #0002;z-index:20}
.btn{background:#18b957;color:#fff;border:0;border-radius:14px;padding:15px 22px;font-weight:800;text-decoration:none}
.btn.white{background:#fff;color:#0b7f3b;border:1px solid #bde8c9}
.section{max-width:1000px;margin:35px auto;padding:25px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.card{background:#fff;border-radius:24px;padding:25px;box-shadow:0 15px 40px #0001;border:1px solid #dcebe3}
h2{margin-top:0;font-size:30px}
input,select,textarea{width:100%;padding:14px;margin:8px 0;border:1px solid #dcebe3;border-radius:12px;font-size:16px}
textarea{min-height:100px}
button{width:100%;margin-top:10px}
.note{text-align:center;color:#607482}
@media(max-width:800px){.cards{grid-template-columns:1fr}.ctaBar{flex-direction:column}}
</style>
</head>
<body>

<section class="hero">
  <img src="IMG_8297.png" alt="SpaceShareFL">
</section>

<div class="ctaBar">
  <a class="btn" href="#find">🔎 Find Storage Near Me</a>
  <a class="btn white" href="#list">🏠 List Your Space</a>
</div>

<section class="section">
  <h2 style="text-align:center">What do you want to do?</h2>
  <p class="note">Choose one option below. Your request will go directly to SpaceShareFL.</p>

  <div class="cards">
    <form id="find" class="card" action="https://formspree.io/f/xdavwkjp" method="POST">
      <h2>Find parking / storage</h2>
      <input type="hidden" name="form_type" value="Renter request">
      <input name="name" placeholder="Your name" required>
      <input name="phone" placeholder="Phone number" required>
      <input name="email" type="email" placeholder="Email" required>
      <select name="storage_type" required>
        <option value="">What do you need to store?</option>
        <option>Boat</option>
        <option>Jet Ski</option>
        <option>Trailer</option>
        <option>RV</option>
        <option>Car / Extra Parking</option>
      </select>
      <input name="city" placeholder="City / area: Hollywood, Miami, Aventura..." required>
      <textarea name="details" placeholder="Size, date, gated/covered, notes"></textarea>
      <button class="btn" type="submit">Send Request</button>
    </form>

    <form id="list" class="card" action="https://formspree.io/f/xdavwkjp" method="POST">
      <h2>List your space</h2>
      <input type="hidden" name="form_type" value="Owner listing">
      <input name="owner_name" placeholder="Your name" required>
      <input name="owner_phone" placeholder="Phone number" required>
      <input name="owner_email" type="email" placeholder="Email" required>
      <input name="city" placeholder="City / area" required>
      <select name="space_type" required>
        <option value="">Space type</option>
        <option>Driveway</option>
        <option>Garage</option>
        <option>Yard</option>
        <option>Gated lot</option>
        <option>Commercial space</option>
      </select>
      <textarea name="details" placeholder="Size, access, price, gated/covered, rules"></textarea>
      <button class="btn" type="submit">Submit My Space</button>
    </form>
  </div>
</section>

<section class="section card">
  <h2>Contact SpaceShareFL</h2>
  <p>Need help? Email us directly:</p>
  <a class="btn" href="mailto:edidkovskiy23@gmail.com">Contact Support</a>
</section>

</body>
</html>
